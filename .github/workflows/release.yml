name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name=velka_${os}_${arch}
            if [ "$os" = windows ]; then
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o build/$name/velka.exe .
              (cd build/$name && zip -q ../../dist/$name.zip velka.exe)
            else
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o build/$name/velka .
              tar -czf dist/$name.tar.gz -C build/$name velka
            fi
          done
          cd dist && sha256sum * > checksums.txt

      - name: Changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          {
            echo "## Changelog"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
          } > notes.md
          cat notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md
